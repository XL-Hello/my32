<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>本地固件与资源服务</title><link rel="stylesheet" href="/style.css"></head><body>
<main><h1>本地固件与资源服务</h1><div class="sub" id="address">正在读取服务状态…</div>
<div class="grid"><section><h2>上传文件</h2><form id="upload"><label>类型</label><select name="category"><option value="ota">OTA 固件</option><option value="resources">普通资源</option></select><input type="file" name="file" required><button>上传并计算 SHA-256</button></form><p class="muted">OTA 上传后自动设为当前发布版本。</p></section><section><h2>当前 OTA 发布</h2><div id="ota" class="muted">未发布 OTA 固件</div></section></div>
<section><div class="row"><h2>文件列表</h2><button id="refresh">刷新</button></div><table><thead><tr><th>路径</th><th>大小</th><th>SHA-256</th><th>操作</th></tr></thead><tbody id="files"></tbody></table></section><section><h2>服务日志</h2><pre id="logs"></pre></section></main><script src="/app.js"></script></body></html>
