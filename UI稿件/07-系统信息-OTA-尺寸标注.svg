<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <title>系统信息与 HTTP OTA 更新页面尺寸标注</title>
  <rect width="1600" height="1020" fill="#F5F8F7"/>
  <text x="60" y="66" fill="#10201F" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="30" font-weight="700">07 系统信息 / HTTP OTA 更新</text>
  <text x="60" y="100" fill="#527169" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16">画布 240 × 320 px；左侧为 2×效果预览，右侧为开发规格与状态机。</text>
  <rect x="60" y="140" width="480" height="640" rx="3" fill="#10201F"/>
  <image href="07-系统信息-检查更新.svg" x="60" y="140" width="480" height="640"/>
  <g fill="none" stroke="#E25D52" stroke-width="2" stroke-dasharray="7 5"><rect x="84" y="262" width="432" height="86" rx="12"/><rect x="84" y="466" width="432" height="86" rx="12"/><rect x="84" y="670" width="432" height="132" rx="12"/></g>
  <g font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700" fill="#FFF"><rect x="91" y="250" width="42" height="24" rx="4" fill="#E25D52"/><text x="99" y="268">C01</text><rect x="91" y="454" width="42" height="24" rx="4" fill="#E25D52"/><text x="99" y="472">C03</text><rect x="91" y="658" width="42" height="24" rx="4" fill="#E25D52"/><text x="99" y="676">A01</text></g>
  <g stroke="#E25D52" stroke-width="2" fill="none"><path d="M60 126h480m0-8v16M60 118v16"/><path d="M44 140v640m-8 0h16m-16-640h16"/><path d="M540 736h100"/></g>
  <g fill="#A64138" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700"><text x="240" y="122">240 px</text><text x="33" y="480" transform="rotate(-90 33 480)">320 px</text><text x="646" y="741">A01：216 × 66，整卡点击</text></g>
  <g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="700" y="166" fill="#10201F" font-size="23" font-weight="700">布局与控件规格</text>
  <rect x="700" y="190" width="830" height="300" rx="10" fill="#FFF" stroke="#D4E2DD"/><g fill="#527169" font-size="15" font-weight="700"><text x="724" y="223">ID</text><text x="810" y="223">对象 / 文字</text><text x="1050" y="223">位置与尺寸（px）</text><text x="1300" y="223">行为</text></g><g stroke="#D4E2DD"><path d="M720 238h790M720 290h790M720 342h790M720 394h790M720 446h790"/></g><g fill="#1D3833" font-size="15"><text x="724" y="270">H01</text><text x="810" y="270">返回 + 系统信息</text><text x="1050" y="270">x16,y16；返回触控 24×24</text><text x="1300" y="270">返回控制中心</text><text x="724" y="322">C01</text><text x="810" y="322">芯片图标 + 本机型号 + 说明</text><text x="1050" y="322">x12,y61，216×43；图标24×24</text><text x="1300" y="322">默认 Dreame ESP32-S3</text><text x="724" y="374">C02</text><text x="810" y="374">系统图标 + OS 版本 + 说明</text><text x="1050" y="374">x12,y112，216×43；图标24×24</text><text x="1300" y="374">默认 v1.0.0</text><text x="724" y="426">C03</text><text x="810" y="426">存储图标 + 机身内存 + 说明</text><text x="1050" y="426">x12,y163，216×43；图标24×24</text><text x="1300" y="426">默认 8 MB / 2 MB</text><text x="724" y="478">A01</text><text x="810" y="478">更新检测 / 下载 / 安装</text><text x="1050" y="478">x12,y233，216×66</text><text x="1300" y="478">按状态机处理</text></g>
  <text x="700" y="545" fill="#10201F" font-size="23" font-weight="700">更新检测状态机</text><g fill="none" stroke="#58A88F" stroke-width="3" marker-end="url(#arrow)"><path d="M720 610h160m25 0h160m25 0h160"/></g><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#58A88F"/></marker></defs><g font-size="17" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-weight="700"><rect x="700" y="574" width="170" height="72" rx="9" fill="#E6F2EE"/><text x="731" y="605" fill="#1D3833">无更新</text><text x="718" y="628" fill="#527169" font-size="12">点击：GET manifest</text><rect x="890" y="574" width="170" height="72" rx="9" fill="#E6F2EE"/><text x="919" y="605" fill="#1D3833">发现更新</text><text x="902" y="628" fill="#527169" font-size="12">显示 ota.path，点击下载</text><rect x="1080" y="574" width="170" height="72" rx="9" fill="#E6F2EE"/><text x="1113" y="605" fill="#1D3833">下载中</text><text x="1090" y="628" fill="#527169" font-size="12">展示百分比，禁用点击</text><rect x="1270" y="574" width="170" height="72" rx="9" fill="#E6F2EE"/><text x="1310" y="605" fill="#1D3833">可安装</text><text x="1286" y="628" fill="#527169" font-size="12">校验通过，点击安装</text></g>
  <text x="700" y="715" fill="#10201F" font-size="23" font-weight="700">状态稿与图标资源</text><g fill="#1D3833" font-size="16" font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="724" y="750">07-系统信息-检查更新.svg/png：初始“无更新”状态</text><text x="724" y="782">08-系统信息-发现更新.svg/png：显示 hello_world.bin，二次点击下载</text><text x="724" y="814">09-系统信息-下载中.svg/png：示例 64% 进度，实际进度按字节刷新</text><text x="724" y="846">10-系统信息-可安装.svg/png：包校验成功，二次点击进入既有 OTA 写分区流程</text><text x="724" y="890">icons/update.svg/png、download.svg/png、install.svg/png：24×24，透明背景、currentColor</text><text x="724" y="930" fill="#A64138">实现提醒：ESP32 不能访问 127.0.0.1；开发时应配置电脑局域网 IP，例如 http://192.168.x.x:8080。</text></g></g>
</svg>
