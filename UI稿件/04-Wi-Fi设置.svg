<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320">
  <title>04-Wi-Fi 设置</title>
  <desc>240×320 嵌入式 Wi-Fi 设置页面，展示已开启、已连接及可纵向滚动的热点列表。</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3432"/>
      <stop offset="1" stop-color="#17302E"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2"/></filter>
    <clipPath id="network-list-clip"><rect x="12" y="210" width="216" height="100" rx="7"/></clipPath>
    <g id="back" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 12H6m5-5-5 5 5 5"/></g>
    <g id="wifi-strong" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M3.7 9.4a11.7 11.7 0 0 1 16.6 0"/><path d="M6.8 12.5a7.25 7.25 0 0 1 10.4 0"/><path d="M9.9 15.6a3.15 3.15 0 0 1 4.2 0"/><path d="M12 19.1h.01" stroke-width="2.6"/>
    </g>
    <g id="wifi-medium" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <path d="M6.8 12.5a7.25 7.25 0 0 1 10.4 0"/><path d="M9.9 15.6a3.15 3.15 0 0 1 4.2 0"/><path d="M12 19.1h.01" stroke-width="2.6"/>
    </g>
    <g id="wifi-low" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9.9 15.6a3.15 3.15 0 0 1 4.2 0"/><path d="M12 19.1h.01" stroke-width="2.6"/></g>
    <g id="refresh" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18.2 9.6A6.65 6.65 0 1 0 18.5 15"/><path d="M18.2 5.4v4.2H14"/></g>
    <g id="lock" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><rect x="5.5" y="10.3" width="13" height="9" rx="1.5"/><path d="M8.5 10.3V8a3.5 3.5 0 0 1 7 0v2.3"/></g>
  </defs>

  <rect width="240" height="320" fill="#10201F"/>
  <ellipse cx="206" cy="45" rx="60" ry="33" fill="#1A4840" opacity=".18" filter="url(#soft)"/>

  <!-- 顶栏 -->
  <g color="#58D6B3"><circle cx="28" cy="28" r="11.5" fill="#17312F" stroke="#39B99B" stroke-width="1"/><use href="#back" x="16" y="16"/></g>
  <text x="54" y="33" fill="#F2FAF7" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600">Wi-Fi 设置</text>

  <!-- C01：46 px 高的 Wi-Fi 总开关 -->
  <rect x="12" y="54" width="216" height="46" rx="7" fill="url(#card)" stroke="#29524C" stroke-width=".7"/>
  <circle cx="37" cy="77" r="13" fill="#1D4A43"/>
  <g color="#58D6B3"><use href="#wifi-strong" x="27" y="67" width="20" height="20"/></g>
  <text x="58" y="76" fill="#F2FAF7" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">Wi-Fi</text>
  <text x="58" y="91" fill="#9BB9B0" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="9">已开启 · 自动加入已知网络</text>
  <rect x="180" y="67" width="36" height="20" rx="10" fill="#58D6B3"/>
  <circle cx="206" cy="77" r="7" fill="#F2FAF7"/>

  <!-- C02：46 px 高的当前连接卡片 -->
  <text x="16" y="116" fill="#9BB9B0" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600">当前连接</text>
  <rect x="12" y="123" width="216" height="46" rx="7" fill="url(#card)" stroke="#326D60" stroke-width=".8"/>
  <circle cx="37" cy="146" r="13" fill="#1D4A43"/>
  <g color="#58D6B3"><use href="#wifi-strong" x="27" y="136" width="20" height="20"/></g>
  <text x="58" y="145" fill="#F2FAF7" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">XWill</text>
  <text x="58" y="160" fill="#9BB9B0" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="9">网络稳定 · 192.168.109.82</text>
  <text x="184" y="145" fill="#7CE3C6" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="9" font-weight="600">已连接</text>

  <!-- 可用网络标题与 A01 扫描操作区：互不重叠，内容纵向居中 -->
  <text x="16" y="193" fill="#9BB9B0" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600">可用网络</text>
  <rect x="172" y="177" width="56" height="24" rx="5" fill="#17312F" stroke="#327866" stroke-width=".7"/>
  <g color="#58D6B3"><use href="#refresh" x="176" y="181" width="16" height="16"/></g>
  <text x="197" y="194" fill="#58D6B3" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="11" font-weight="600">扫描</text>

  <!-- L01：可纵向滚动的热点列表视窗；第三条部分露出提示可继续滑动 -->
  <rect x="12" y="210" width="216" height="100" rx="7" fill="url(#card)" stroke="#284F4A" stroke-width=".7"/>
  <g clip-path="url(#network-list-clip)">
    <line x1="24" y1="250" x2="216" y2="250" stroke="#31534E" stroke-width=".65"/>
    <line x1="24" y1="290" x2="216" y2="290" stroke="#31534E" stroke-width=".65"/>
    <!-- N01：受保护网络 -->
    <text x="24" y="228" fill="#F2FAF7" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">Home_5G</text>
    <text x="24" y="242" fill="#78988F" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="8">需要密码</text>
    <g color="#9BB9B0"><use href="#lock" x="163" y="222" width="16" height="16"/></g>
    <g color="#F2FAF7"><use href="#wifi-strong" x="192" y="218" width="20" height="20"/></g>
    <!-- N02：开放网络 -->
    <text x="24" y="268" fill="#F2FAF7" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">Guest</text>
    <text x="24" y="282" fill="#78988F" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="8">开放网络</text>
    <g color="#F2FAF7"><use href="#wifi-medium" x="192" y="258" width="20" height="20"/></g>
    <!-- N03：内容超出视窗，保留顶部作为滚动提示 -->
    <text x="24" y="308" fill="#F2FAF7" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="500">Studio_2.4G</text>
    <g color="#9BB9B0"><use href="#lock" x="163" y="302" width="16" height="16"/></g>
    <g color="#F2FAF7"><use href="#wifi-low" x="192" y="298" width="20" height="20"/></g>
  </g>
  <rect x="222" y="218" width="2" height="84" rx="1" fill="#264A44"/>
  <rect x="222" y="218" width="2" height="34" rx="1" fill="#58D6B3"/>
</svg>
