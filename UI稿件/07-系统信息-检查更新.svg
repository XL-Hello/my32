<svg xmlns="http://www.w3.org/2000/svg" width="240" height="320" viewBox="0 0 240 320">
  <title>07-系统信息-检查更新</title><desc>系统信息默认状态，点击更新检测卡片发起 HTTP 检查。</desc>
  <defs><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B3432"/><stop offset="1" stop-color="#17302E"/></linearGradient>
    <g id="back" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 12H6m5-5-5 5 5 5"/></g><g id="chip" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M9 3v4m3-4v4m3-4v4M9 17v4m3-4v4m3-4v4M3 9h4m-4 3h4m-4 3h4m10-6h4m-4 3h4m-4 3h4"/></g><g id="os" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 8 4-8 4-8-4 8-4Z"/><path d="m4 12 8 4 8-4M4 17l8 4 8-4"/></g><g id="storage" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h3"/></g><g id="update" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.35 5.65"/><path d="M20 4v7h-7"/></g><g id="chevron" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m9 5 6 7-6 7"/></g></defs>
  <rect width="240" height="320" fill="#10201F"/><ellipse cx="205" cy="48" rx="58" ry="35" fill="#1A4840" opacity=".18"/>
  <!-- H01 顶栏；点击返回控制中心 --> <g color="#58D6B3"><circle cx="28" cy="28" r="11.5" fill="#17312F" stroke="#39B99B"/><use href="#back" x="16" y="16"/></g><text x="54" y="33" fill="#F2FAF7" font-family="Noto Sans SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="600">系统信息</text>
  <!-- C01-C03 静态信息卡片 -->
  <g font-family="Noto Sans SC,Microsoft YaHei,sans-serif"><text x="16" y="54" fill="#9BB9B0" font-size="10" font-weight="600">设备</text>
  <rect x="12" y="61" width="216" height="43" rx="7" fill="url(#card)" stroke="#29524C" stroke-width=".7"/><circle cx="37" cy="82.5" r="13" fill="#1D4A43"/><g color="#58D6B3"><use href="#chip" x="25" y="70.5"/></g><text x="58" y="80" fill="#F2FAF7" font-size="14" font-weight="600">本机型号</text><text x="58" y="94" fill="#9BB9B0" font-size="9">Dreame ESP32-S3</text>
  <rect x="12" y="112" width="216" height="43" rx="7" fill="url(#card)" stroke="#29524C" stroke-width=".7"/><circle cx="37" cy="133.5" r="13" fill="#1D4A43"/><g color="#58D6B3"><use href="#os" x="25" y="121.5"/></g><text x="58" y="131" fill="#F2FAF7" font-size="14" font-weight="600">OS 版本</text><text x="58" y="145" fill="#9BB9B0" font-size="9">v1.0.0 · 当前稳定版</text>
  <rect x="12" y="163" width="216" height="43" rx="7" fill="url(#card)" stroke="#29524C" stroke-width=".7"/><circle cx="37" cy="184.5" r="13" fill="#1D4A43"/><g color="#58D6B3"><use href="#storage" x="25" y="172.5"/></g><text x="58" y="182" fill="#F2FAF7" font-size="14" font-weight="600">机身内存</text><text x="58" y="196" fill="#9BB9B0" font-size="9">8 MB Flash · 2 MB LittleFS</text>
  <!-- A01 更新检测：初始状态；整卡 216×66 为点击热区 --> <text x="16" y="226" fill="#9BB9B0" font-size="10" font-weight="600">软件更新</text><rect x="12" y="233" width="216" height="66" rx="7" fill="url(#card)" stroke="#326D60" stroke-width=".8"/><circle cx="37" cy="266" r="13" fill="#1D4A43"/><g color="#58D6B3"><use href="#update" x="25" y="254"/></g><text x="58" y="260" fill="#F2FAF7" font-size="14" font-weight="600">更新检测</text><text x="58" y="276" fill="#9BB9B0" font-size="9">无更新 · 轻触检查</text><g color="#58D6B3"><use href="#chevron" x="202" y="254"/></g></g>
</svg>
